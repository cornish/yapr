name: build

# Every push/PR builds and packages all platforms (artifacts downloadable
# from the run). Pushing a tag vX.Y.Z additionally creates a *draft* GitHub
# release with the binaries attached; review it and click Publish.
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  QT_VERSION: 6.11.3

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Read version from CMakeLists.txt
        run: |
          version=$(sed -n 's/^[[:space:]]*VERSION[[:space:]]\+\([0-9.]\+\).*/\1/p' CMakeLists.txt | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "CMake version: $version"
      - name: Tag must match CMake version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if [ "${GITHUB_REF_NAME}" != "v${{ steps.v.outputs.version }}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match CMakeLists.txt VERSION ${{ steps.v.outputs.version }}"
            exit 1
          fi

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-pdf
            mingw-w64-ucrt-x86_64-qt6-tools
      - name: Build
        shell: msys2 {0}
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Package (portable zip + installer)
        shell: pwsh
        run: ./scripts/package-windows.ps1 -Msys2Root "${{ steps.msys2.outputs.msys2-location }}"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/yapr-*-windows-x64-portable.zip
            dist/yapr-*-windows-x64-setup.exe
          if-no-files-found: error

  linux:
    needs: version
    runs-on: ubuntu-22.04   # oldest supported glibc = widest AppImage compatibility
    steps:
      - uses: actions/checkout@v4
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build libgl1-mesa-dev libegl1 libfontconfig1 libdbus-1-3 \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-xkb1 libcups2 file
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/Qt
          key: qt-linux-${{ env.QT_VERSION }}-qtpdf
      - name: Install Qt
        run: |
          if [ ! -d ~/Qt/$QT_VERSION/gcc_64 ]; then
            pip install aqtinstall
            aqt install-qt linux desktop $QT_VERSION linux_gcc_64 -m qtpdf --outputdir ~/Qt
          fi
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_PREFIX_PATH=$HOME/Qt/$QT_VERSION/gcc_64
          cmake --build build
      - name: Package (AppImage)
        run: QMAKE=$HOME/Qt/$QT_VERSION/gcc_64/bin/qmake ./scripts/package-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/yapr-*-linux-x86_64.AppImage
          if-no-files-found: error

  macos:
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/Qt
          key: qt-macos-${{ env.QT_VERSION }}-qtpdf
      - name: Install Qt
        run: |
          if [ ! -d ~/Qt/$QT_VERSION/macos ]; then
            pip install aqtinstall
            aqt install-qt mac desktop $QT_VERSION clang_64 -m qtpdf --outputdir ~/Qt
          fi
      - name: Build (universal arm64 + x86_64)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_PREFIX_PATH=$HOME/Qt/$QT_VERSION/macos \
                -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
                -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0
          cmake --build build --parallel
      - name: Package (dmg)
        run: MACDEPLOYQT=$HOME/Qt/$QT_VERSION/macos/bin/macdeployqt ./scripts/package-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/yapr-*-macos.dmg
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, windows, linux, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: yapr ${{ needs.version.outputs.version }}
          generate_release_notes: true
          files: artifacts/*
